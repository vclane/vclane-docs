[project]
site_name = "VCLane Docs"
site_url = "https://vclane.github.io/vclane-docs/"
site_description = "Adaptive Traffic Monitoring System — Documentation"
copyright = "&copy; 2026 VCLane"
repo_url = "https://github.com/vclane/"
repo_name = "vclane"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "About" = [
    { "Overview" = "overview.md" },
    { "Features" = "features.md" },
    { "Architectural Advantages" = "architectural-advantages.md" },
  ]},
  { "Documentation" = [
    { "Architecture" = "architecture.md" },
    { "Edge Device" = "edge-device.md" },
    { "Traffic Controller" = "traffic-controller.md" },
    { "Backend API" = "backend-api.md" },
    { "Media Server" = "media-server.md" },
    { "MQTT Communication" = "mqtt-communication.md" },
    { "Server Integration" = "server-integration.md" },
    { "Mobile App" = "mobile-app.md" },
  ]},
  { "Changelog" = "changelog.md" },
]

[project.extra]
social = [
  { icon = "simple/github", link = "https://github.com/vclane" },
]

[project.theme]
variant = "modern"
logo = "assets/logo.png"
favicon = "assets/logo.png"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.tabs.link",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]